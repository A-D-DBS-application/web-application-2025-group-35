{% extends "index.html" %}

{% block main_content %}
<h1 class="mb-4">Nieuwe Fiets Toevoegen</h1>

<form action="/fietsen/toevoegen" method="POST" class="p-3 bg-white rounded shadow-sm" style="max-width: 500px;">
    
    <!-- Itemnummer -->
    <label class="form-label">Itemnummer</label>
    <input type="number" name="itemnr" class="form-control mb-3" required>

    <!-- Status -->
    <label class="form-label">Status</label>
    <select name="status" class="form-select mb-3">
        <option value="BESCHIKBAAR">Beschikbaar</option>
        <option value="VERHUURD">Verhuurd</option>
        <option value="ONDERHOUD">Onderhoud</option>
    </select>

    <!-- Leeftijdscategorie -->
    <label class="form-label">Leeftijdscategorie</label>
    <select name="leeftijdscategorie" class="form-select mb-4">
        <option value="LOOPFIESTEN">1–4 jaar</option>
        <option value="PEUTER">2–3 jaar</option>
        <option value="KLEUTER">4–6 jaar</option>
        <option value="JUNIOR">6–8 jaar</option>
        <option value="KIDS">8–12 jaar</option>
        <option value="TEEN">14–16 jaar</option>
        <option value="OUDER_DAN_16">Ouder dan 16 jaar</option>
    </select>

    <!-- Submit -->
    <button type="submit" class="btn-save">Opslaan</button>
</form>
{% endblock %}
