{% extends 'index.html' %}

{% block main_content %}
<h1 class="mb-3">Welkom bij het Bike Lending Portaal</h1>

{% if session.get('rol') %}
    <p class="mb-2">Je bent ingelogd als: <strong>{{ session.get('rol') }}</strong></p>
    <a href="/logout" class="btn btn-cancel">Uitloggen</a>
{% else %}
    <p><a href="/login" class="btn btn-add">Login</a> om verder te gaan</p>
{% endif %}

<p class="mt-4">Selecteer een onderdeel uit het menu links.</p>
{% endblock %}
