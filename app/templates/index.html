<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% if title %}{{ title }}{% else %}Bike Lending{% endif %}</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Eigen stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="d-flex">

    <!-- SIDEBAR -->
    <nav class="sidebar">
        <h2 class="sidebar-title">Bike Lending Portaal</h2>

        <a href="/" class="nav-item">Home</a>
        <a href="/klanten" class="nav-item">Klanten</a>
        <a href="/fietsen" class="nav-item">Fietsen</a>
        <a href="/verhuur" class="nav-item">Verhuur</a>
        <a href="/financieel" class="nav-item">Financieel</a>
        <a href="/voorspelling" class="nav-item">Voorspelling</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content container-fluid">
        {% block main_content %}{% endblock %}
    </main>

    {% block popup %}{% endblock %}

    <!-- Bootstrap JS -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
