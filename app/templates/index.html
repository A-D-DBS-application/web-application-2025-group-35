<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }}{% else %}Bike Lending{% endif %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: #1e293b;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            min-height: 100vh;
        }

        .sidebar h2 {
            margin-bottom: 1rem;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: block;
        }

        .nav-link:hover {
            background: #334155;
        }

        .main-content {
            flex: 1;
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
        }

        th {
            background: #e2e8f0;
        }

        /* UNIFORME KNOPPEN */
        .add-button, .save-btn, .cancel-btn, .edit-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        /* Toevoegen → blauw + wit plusje */
        .add-button {
            background: #2563eb;
            color: white;
        }
        .add-button::before {
            content: "+";
            font-weight: bold;
            color: white;
        }

        /* Opslaan */
        .save-btn {
            background: #16a34a;
            color: white;
        }

        /* Annuleer */
        .cancel-btn {
            background: #dc2626;
            color: white;
        }

        /* Bewerken */
        .edit-btn {
            background: #fb923c;
            color: white;
        }

        /* Hover */
        .add-button:hover { background: #1d4ed8; }
        .save-btn:hover { background: #15803d; }
        .cancel-btn:hover { background: #b91c1c; }
        .edit-btn:hover { background: #f97316; }

        /* POPUP OVERLAY */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 9999;
        }

        /* POPUP BOX */
        .popup {
            background: white;
            padding: 22px;
            border-radius: 10px;
            width: 420px;
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
        }

        .popup h3 {
            margin-top: 0;
        }

        /* Child row styling */
        .child-row input {
            height: 30px;
        }

        .search-bar input {
            padding: 8px;
            width: 260px;
        }

        
        .status-beschikbaar {
            color: #0c7a00;
            font-weight: bold;
        }

        .status-verhuurd {
            color: #c40000;
            font-weight: bold;
        }

        .status-onderhoud {
            color: #d98600;
            font-weight: bold;

        }    

    </style>

</head>

<body>

    <div class="sidebar">
        <h2>Bike Lending portaal</h2>
        <a href="/" class="nav-link">Home</a>
        <a href="/klanten" class="nav-link">Klanten</a>
        <a href="/fietsen" class="nav-link">Fietsen</a>
        <a href="/verhuur" class="nav-link">Verhuur</a>
        <a href="/financieel" class="nav-link">Financieel</a>
    </div>

    <div class="main-content">
        {% block main_content %}{% endblock %}
    </div>

    {% block popup %}{% endblock %}

</body>
</html>
