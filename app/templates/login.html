{% extends 'index.html' %}

{% block main_content %}

<div class="login-box mx-auto mt-5 p-4 bg-white rounded shadow-sm">

    <h2 class="text-center mb-4">Inloggen</h2>

    <form method="post" action="/login">
        
        <label for="rol" class="form-label">Selecteer uw rol</label>
        <select name="rol" id="rol" class="form-select mb-3" required>
            <option value="">— Maak een keuze —</option>
            <option value="depotmedewerker">Depotmedewerker</option>
            <option value="financieel">Financieel medewerker</option>
        </select>

        <button type="submit" class="btn-login w-100">Inloggen</button>
    </form>

</div>

{% endblock %}
